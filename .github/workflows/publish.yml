# Generated manual publication; pushes and tags never publish automatically.
name: Publish validated Python package
'on':
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag containing the validated package assets (vX.Y.Z)
        required: true
        type: string
      manifest_sha256:
        description: SHA-256 from the reviewed local publication manifest
        required: true
        type: string
      publish:
        description: Upload to PyPI after verification (leave unchecked for verification only)
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: python-pypi-publication
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'sellapp/sellapp-python' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify retained package hashes and source identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: >-
          python3 .github/scripts/verify-python-publication.py --tag "$RELEASE_TAG" --sha256
          "$MANIFEST_SHA256"
      - name: Retain verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-pypi-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: verify
    if: inputs.publish && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/sellapp-sdk/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: verified-pypi-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
      - name: Publish the verified wheel and source distribution
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/
          attestations: true
          skip-existing: false
